name: Build APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore app/release.jks -alias karpardaz -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Karpardaz, OU=Dev, O=App, L=Tehran, S=Tehran, C=IR"

      - name: Build Signed APK and AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Karpardaz-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB (For Cafe Bazaar)
        uses: actions/upload-artifact@v4
        with:
          name: Karpardaz-Signed-AAB
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Karpardaz-Keystore
          path: app/release.jks
