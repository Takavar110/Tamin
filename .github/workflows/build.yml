name: Build APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK and AAB
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Sign & Align APK & AAB
        run: |
          # ساخت کلید امضا
          keytool -genkey -v -keystore release.jks -alias karpardaz -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Karpardaz, OU=Dev, O=App, L=Tehran, S=Tehran, C=IR"
          
          # پیدا کردن مسیر ابزارهای اندروید (zipalign و apksigner)
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # 1. آماده‌سازی و امضای AAB برای کافه‌بازار
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass 123456 app/build/outputs/bundle/release/app-release.aab karpardaz
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/karpardaz-signed.aab

          # 2. تراز کردن (zipalign) فایل APK
          $BUILD_TOOLS_PATH/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-aligned.apk
          
          # 3. امضای رسمی اندروید (V2/V3 Scheme با apksigner)
          $BUILD_TOOLS_PATH/apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias karpardaz --key-pass pass:123456 --out app/build/outputs/apk/release/karpardaz-signed.apk app/build/outputs/apk/release/app-aligned.apk

      - name: Upload Signed APK (For Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: Karpardaz-Signed-APK
          path: app/build/outputs/apk/release/karpardaz-signed.apk

      - name: Upload Signed AAB (For Cafe Bazaar)
        uses: actions/upload-artifact@v4
        with:
          name: Karpardaz-Signed-AAB
          path: app/build/outputs/bundle/release/karpardaz-signed.aab
